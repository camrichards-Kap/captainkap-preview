    <style>
    /* ================================================================
       KAP NATIVE INTEGRATION LAYER
       Refactors the toolkit's presentation onto the captainkap.com
       design system (tokens below mirror the site's :root variables).
       Business logic, calculations, and state are untouched — these
       rules only replace the app-shell chrome and component skins.
       ================================================================ */
    :root{
      --navy:#0a2540; --navy-2:#0e2c4d; --navy-deep:#071a30;
      --gold:#c8a24a; --gold-soft:#dcc178;
      --paper:#f6f7f9; --ink:#1a2331; --muted:#5c6a7d; --line:#e2e6ec;
      color-scheme: light;                      /* stay in step with the site */
    }
    body, button, input, select, textarea { font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }
    h1 { font-family:'Oswald','Inter',sans-serif; letter-spacing:.5px; }
    input[type=radio], input[type=checkbox], input[type=range] { accent-color:var(--gold); }

    /* ---- 1. Remove app chrome (page already provides section header,
            disclaimer, and page flow — no duplicate shell) ---- */
    #root > div > div.no-print:first-child,     /* app's own disclaimer strip */
    #root > div > header,                       /* app's command-bar banner   */
    #root footer { display:none !important; }   /* app's footer               */

    /* ---- 2. Tab nav → the site's pill-tab pattern (.gtab) ---- */
    #root > div > nav { background:transparent !important; border:0 !important; }
    #root > div > nav > div, #root > div > nav *:not(a){ background:transparent !important; }
    #root > div > nav > div { max-width:100% !important; padding:6px 2px 2px !important; }
    #root > div > nav a{
      font-family:'Oswald','Inter',sans-serif !important;
      font-size:.7rem !important; font-weight:600 !important;
      letter-spacing:1.2px !important; text-transform:uppercase !important;
      padding:9px 14px !important; border-radius:30px !important;
      border:1px solid var(--line) !important; background:#fff !important;
      color:var(--muted) !important; transition:.2s !important;
    }
    #root > div > nav a:hover{ border-color:var(--navy) !important; color:var(--navy) !important; }
    #root > div > nav a.bg-brand, #root > div > nav a[class*="bg-brand"]{
      background:var(--navy) !important; color:#fff !important; border-color:var(--navy) !important;
    }

    /* ---- 3. Layout: flow with the page's .wrap, not the app's own gutters ---- */
    main{ max-width:100% !important; padding:14px 2px 26px !important; }

    /* ---- 4. Cards → the site's .tool card tokens ---- */
    .tool-card{
      border-radius:12px !important; border:1px solid var(--line) !important;
      box-shadow:0 24px 56px -36px rgba(10,37,64,.4) !important; background:#fff !important;
    }
    .tool-card-header h2{
      font-family:'Oswald','Inter',sans-serif !important; text-transform:uppercase !important;
      letter-spacing:.5px !important; color:var(--ink) !important;
    }

    /* ---- 5. Form controls + focus states → site inputs ---- */
    main input[type=text], main input[type=number], main input[type=email], main select, main textarea{
      border:1px solid var(--line) !important; border-radius:6px !important; background:#fff !important;
    }
    /* numeric fields ($-prefix inputs) already sit inside the app's own
       bordered wrapper — style the WRAPPER with site tokens and strip the
       inner input completely, or you get a box inside a box */
    main .rounded-md.border{ border-color:var(--line) !important; background:#fff !important; }
    main .rounded-md.border input[type=text], main .rounded-md.border input[type=number]{
      border:0 !important; border-radius:0 !important; background:transparent !important; box-shadow:none !important;
    }
    main input:focus-visible, main select:focus-visible, main textarea:focus-visible,
    main button:focus-visible, nav a:focus-visible{
      outline:2px solid rgba(200,162,74,.6) !important; outline-offset:1px !important;
      border-color:var(--gold) !important;
    }
    /* inside a wrapper, the wrapper carries the focus treatment instead */
    main .rounded-md.border input:focus-visible{ outline:none !important; }
    main .rounded-md.border:focus-within{ border-color:var(--gold) !important; box-shadow:0 0 0 2px rgba(200,162,74,.35) !important; }

    /* ---- 6. Buttons → site .btn voice (Oswald, uppercase, tracked) ---- */
    main button[class*="bg-brand"], main button[class*="bg-["]{
      font-family:'Oswald','Inter',sans-serif !important; text-transform:uppercase !important;
      letter-spacing:1px !important; border-radius:4px !important;
    }

    /* ---- 7. Headline results → site stat treatment (Oswald numerals) ---- */
    main .text-2xl, main .text-3xl, main .text-4xl{
      font-family:'Oswald','Inter',sans-serif; letter-spacing:.5px;
    }

    /* ---- 8. Mobile: pills wrap, cards breathe, no horizontal scroll ---- */
    @media (max-width:640px){
      #root > div > nav a{ padding:8px 11px !important; font-size:.64rem !important; }
      main{ padding:10px 0 20px !important; }
    }

    /* ---- 9. Content-driven height. The app root's min-h-screen (100vh)
            ratchets the embed: inside the iframe 100vh = frame height, so
            once the frame grows for a tall tab (Credit Cards, Summary) the
            document can never report a smaller height again — leaving a
            large blank band under the toolkit on shorter tabs. Kill the
            floor; body carries the background so standalone/full-screen
            use still paints edge to edge. ---- */
    html, body{ background:var(--paper); }
    .min-h-screen{ min-height:0 !important; }

    /* ---- 10. No content behind invisible scrollbars. The app caps its one
            long table (Where to Retire's 50-state comparison) at max-h-96
            with an inner scrollbar — on trackpads the scrollbar is invisible
            until touched, so the table reads as "cut off". Embedded pages
            scroll naturally: let the container expand to its full content
            instead. (Scoped to main; nothing else uses max-h-96 today.) ---- */
    main .max-h-96{ max-height:none !important; }
    </style>

    <div id="root"></div>
    <script id="kap-budget-fix">
    /* Runs BEFORE the app hydrates its stores. The budget's "Credit card
       payments" line invited double counting (card-paid dining entered in
       Dining AND again as a card payment). The default item label now says
       "debt paydown, old balances only" — this migrates the label inside
       any previously-persisted budget state so existing users see the
       clarified wording too (amounts untouched). */
    (function(){
      try {
        var raw = localStorage.getItem('mft.budget.v1');
        if (!raw) return;
        var data = JSON.parse(raw);
        var items = data && data.state && data.state.items;
        if (!items) return;
        var changed = false;
        for (var i=0;i<items.length;i++){
          if (items[i].id==='creditcards' && items[i].label!=='Credit card debt paydown (old balances only — card spending entered above already counts)'){
            items[i].label = 'Credit card debt paydown (old balances only — card spending entered above already counts)';
            changed = true;
          }
        }
        if (changed) localStorage.setItem('mft.budget.v1', JSON.stringify(data));
      } catch(e){}
    })();
    </script>

<style id="kap-gate-css">
  /* access-control UI — site design tokens only */
  .kap-gated{filter:blur(7px);pointer-events:none;user-select:none}
  .kap-hidden{display:none !important}
  .kap-hide{display:none !important}
  .kap-lockdot{opacity:.75;margin-right:4px}
  .kap-accessbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:2px 2px 14px;padding:12px 16px;
    background:#fff;border:1px solid var(--line);border-radius:12px;font-family:'Inter',sans-serif;font-size:.85rem;color:var(--muted)}
  .kap-accessbar b{color:var(--ink);font-weight:600}
  .kap-accessbar input{padding:8px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;min-width:150px}
  .kap-accessbar input:focus-visible{outline:2px solid rgba(200,162,74,.6);outline-offset:1px;border-color:var(--gold)}
  .kap-btn{display:inline-block;background:var(--gold);color:var(--navy-deep);font-family:'Oswald',sans-serif;font-weight:600;
    letter-spacing:1.2px;text-transform:uppercase;font-size:.78rem;padding:10px 20px;border-radius:4px;border:0;cursor:pointer}
  .kap-btn:hover{background:var(--gold-soft)}
  .kap-btn.navy{background:none;border:2px solid var(--navy);color:var(--navy);padding:8px 18px}
  .kap-btn.navy:hover{background:var(--navy);color:#fff}
  .kap-err{color:#b3202c;font-size:.78rem;font-weight:600;min-height:1em;width:100%}
  .kap-fullbadge{display:inline-flex;align-items:center;gap:8px;background:rgba(200,162,74,.12);border:1px solid var(--gold);
    color:var(--ink);border-radius:30px;padding:8px 16px;font-family:'Oswald',sans-serif;font-size:.74rem;letter-spacing:1.2px;text-transform:uppercase}
  .kap-fullbadge b{color:var(--gold)}
  .kap-premium{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 56px -36px rgba(10,37,64,.4);
    padding:34px 30px;font-family:'Inter',sans-serif;margin-bottom:20px}
  .kap-premium .kick{font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .kap-premium h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);font-size:1.4rem;margin:0 0 8px}
  .kap-premium .what{color:var(--ink);font-size:.95rem;margin:0 0 6px}
  .kap-premium .why{color:var(--muted);font-size:.88rem;margin:0 0 18px}
  .kap-premium .divider{border-top:1px dashed var(--line);margin:18px 0}
  .kap-premium ul{list-style:none;padding:0;margin:0 0 16px;columns:2;gap:24px}
  .kap-premium li{padding:3px 0 3px 22px;position:relative;font-size:.85rem;color:var(--ink);break-inside:avoid}
  .kap-premium li:before{content:"\2713";position:absolute;left:0;color:var(--gold);font-weight:700}
  .kap-premium .price{font-family:'Oswald',sans-serif;font-size:1.5rem;color:var(--gold);margin-right:14px;vertical-align:middle}
  .kap-premium .note{font-size:.75rem;color:var(--muted);margin-top:14px}
  .kap-premium .codewrap{margin-top:16px;font-size:.8rem;color:var(--muted)}
  .kap-premium .codewrap input{padding:8px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;margin:0 8px 0 6px}
  @media(max-width:640px){.kap-premium ul{columns:1}.kap-premium{padding:24px 18px}}
  @media print{.kap-gated,.kap-premium,.kap-accessbar{display:none !important}}
</style>
<script id="kap-gate">
/* ================================================================
   KAP ACCESS LAYER — product access control for the toolkit.
   ----------------------------------------------------------------
   ARCHITECTURE
   • KapAccess is the SINGLE SOURCE OF TRUTH: level() → 'limited'|'full'.
     Every gate below asks KapAccess — no scattered booleans.
   • The credential lives in ONE place (KapAccess.validate). Today it
     checks a hard-coded code; to move to real purchase verification,
     replace validate() with an API call and grant() on success —
     nothing else in this file (or the site) needs to change.
   • This is a product-access/UX gate, NOT security: it runs client-
     side and deters casual users only. Do not represent it as
     payment verification.
   • Presentation-only: calculations, state, and routing in the
     compiled app are untouched. Locked tools stay mounted but
     visually replaced by a premium preview panel.
   ================================================================ */
(function(){
  'use strict';

  /* ---------------- access core (the ONE place) ---------------- */
  var KapAccess = {
    _KEY: 'kap_access_level',
    _CODES: ['financiallyfree'],            /* ← swap point: replace with server-side entitlement check */
    level: function(){
      try{
        if (localStorage.getItem(this._KEY) === 'full') return 'full';
        if (localStorage.getItem('kap_full_access') === '1') return 'full';  /* legacy key migration */
      }catch(e){}
      return 'limited';
    },
    grant: function(){ try{ localStorage.setItem(this._KEY,'full'); }catch(e){} applyAll(); try{ document.dispatchEvent(new CustomEvent('kap-access-change')); }catch(e){} },
    validate: function(code){ return this._CODES.indexOf(String(code||'').trim().toLowerCase()) !== -1; },
    tryUnlock: function(code, errEl){
      if (this.validate(code)) { this.grant(); return true; }
      if (errEl) errEl.textContent = 'Invalid access code. Please check your code and try again.';
      return false;
    }
  };
  window.KapAccess = KapAccess;             /* exposed for future wiring */

  /* ---------------- premium catalog (config, not hacks) ---------------- */
  var PREMIUM = {
    '/pcs':            { name:'PCS Move Planner', what:'DLA, MALT, per-diem, and out-of-pocket estimates for your next PCS move.', why:'Know what the military owes you before you move — most families leave entitlements unclaimed.' },
    '/deployment':     { name:'Deployment Wealth Builder', what:'SDP returns and CZTE tax-free savings modeling for your deployment.', why:'One deployment can jump-start your net worth — if the money is positioned right.' },
    '/tsp':            { name:'TSP / BRS Optimizer', what:'Model contributions, match capture, and long-term growth under the Blended Retirement System.', why:'The match is free money — see exactly what capturing it is worth over a career.' },
    '/credit-cards':   { name:'Military Credit Card Benefits', what:'Compare premium cards with SCRA/MLA annual-fee waivers for service members.', why:'Fee waivers on active duty can mean hundreds of dollars in perks every year.', note:'This tool is included in Full Access ($27). Looking for the advanced Credit Card Hacking playbook? That’s our separate $47 product on this page.' },
    '/civilian-pay':   { name:'Military → Civilian Pay', what:'Translate your full military compensation into the civilian salary you’d actually need.', why:'BAH and BAS are tax-free — most people underestimate their real pay by 20%+.' },
    '/va-disability':  { name:'VA Disability Calculator', what:'2026 VA disability compensation by rating and dependents.', why:'Understand the tax-free benefit picture before you file.' },
    '/pension':        { name:'Pension Projector', what:'Project your High-3 or BRS pension across retirement scenarios.', why:'See what 20 years of service is actually worth in lifetime dollars.' },
    '/where-to-retire':{ name:'Where to Retire', what:'Compare states on military-retirement taxes and cost of living.', why:'The same pension goes 30% further in the right state.' }
  };
  var FEATURES = ['PCS planning','Deployment (SDP + CZTE)','TSP / BRS analysis','Credit card benefits','Civilian pay translation','VA disability','Pension planning','Where to retire','Detailed financial summary'];

  function route(){ return (location.hash || '#/pay').replace(/^#/, '').split('?')[0]; }
  function leafWithText(rx){
    var all = document.querySelectorAll('main *');
    for (var i=0;i<all.length;i++){ if (all[i].children.length===0 && rx.test((all[i].textContent||'').trim())) return all[i]; }
    return null;
  }
  function goProducts(e){
    if (e) e.preventDefault();
    try { window.parent.document.getElementById('mil-products').scrollIntoView({behavior:'smooth'}); }
    catch(err){ try { window.open('../#/military','_top'); } catch(e2){} }
  }
  function codeRow(idPrefix){
    return '<div class="codewrap">Already purchased? <input id="'+idPrefix+'-in" placeholder="Access code" aria-label="Access code">' +
           '<button type="button" class="kap-btn navy" id="'+idPrefix+'-go" style="font-size:.68rem;padding:7px 12px">Unlock</button>' +
           '<div class="kap-err" id="'+idPrefix+'-err"></div></div>';
  }
  function wireCode(idPrefix){
    var go = document.getElementById(idPrefix+'-go');
    if (!go) return;
    go.onclick = function(){ KapAccess.tryUnlock(document.getElementById(idPrefix+'-in').value, document.getElementById(idPrefix+'-err')); };
    document.getElementById(idPrefix+'-in').addEventListener('keydown', function(ev){ if (ev.key==='Enter'){ ev.preventDefault(); go.onclick(); } });
  }

  /* ---------------- UI: access bar (top of toolkit) ---------------- */
  function renderBar(){
    var nav = document.querySelector('#root > div > nav');
    if (!nav) return;
    var bar = document.getElementById('kap-accessbar');
    if (!bar){ bar = document.createElement('div'); bar.id='kap-accessbar'; bar.className='kap-accessbar'; nav.parentElement.insertBefore(bar, nav.nextSibling); }
    if (KapAccess.level()==='full'){
      bar.innerHTML = '<span class="kap-fullbadge"><b>✓</b> Full Toolkit Access</span><span>Every tool and your complete financial summary are unlocked.</span>';
    } else if (!bar.dataset.ready){
      bar.innerHTML = '<span><b>Have Full Access?</b> Enter your access code to unlock the complete toolkit.</span>' +
        '<input id="kap-bar-in" placeholder="Access code" aria-label="Access code">' +
        '<button type="button" class="kap-btn" id="kap-bar-go">Unlock</button>' +
        '<span class="kap-err" id="kap-bar-err" style="width:auto"></span>';
      wireCode('kap-bar');
      bar.dataset.ready = '1';
    }
  }

  /* ---------------- UI: nav lock badges ---------------- */
  function renderNavLocks(){
    document.querySelectorAll('#root > div > nav a').forEach(function(a){
      var r = (a.getAttribute('href')||'').replace(/^#/, '');
      var dot = a.querySelector('.kap-lockdot');
      if (KapAccess.level()==='limited' && PREMIUM[r]){
        if (!dot){ dot = document.createElement('span'); dot.className='kap-lockdot'; dot.textContent='🔒'; a.insertBefore(dot, a.firstChild); }
      } else if (dot) dot.remove();
    });
  }

  /* ---------------- UI: premium preview panel (locked tools) ---------------- */
  function renderRouteGate(){
    var main = document.querySelector('main');
    if (!main) return;
    var r = route(), locked = KapAccess.level()==='limited' && PREMIUM[r];
    var panel = document.getElementById('kap-premium');
    /* restore hidden tool content when allowed */
    if (!locked){
      if (panel) panel.remove();
      main.querySelectorAll('.kap-hidden').forEach(function(el){ el.classList.remove('kap-hidden'); });
      return;
    }
    var p = PREMIUM[r];
    main.querySelectorAll(':scope > *').forEach(function(el){ if (el.id!=='kap-premium') el.classList.add('kap-hidden'); });
    if (!panel || panel.dataset.route !== r){
      if (panel) panel.remove();
      panel = document.createElement('div');
      panel.id='kap-premium'; panel.className='kap-premium'; panel.dataset.route = r;
      panel.innerHTML =
        '<div class="kick">🔒 PREMIUM TOOL · FULL ACCESS</div>' +

<script id="kap-stepper">
/* Years of Service stepper: [−] 6 [+] beside the existing typed input.
   ONE source of truth — the app's React state. The buttons write through
   the native value setter + an 'input' event, which fires the component's
   own onChange, so every dependent calculation updates immediately and
   typing keeps working exactly as before. Whole numbers, clamped 0–40
   (the same min/max the app passes to this field). */
(function(){
  'use strict';
  var setVal = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
  function reactSet(input, v){
    setVal.call(input, String(v));
    input.dispatchEvent(new Event('input', {bubbles:true}));
  }
  function bump(input, d){
    var v = parseFloat(input.value); if (!isFinite(v)) v = 0;
    v = Math.round(v) + d;
    if (v < 0) v = 0; if (v > 40) v = 40;
    reactSet(input, v);
  }
  function enhance(){
    var labs = document.querySelectorAll('#root main label');
    for (var i=0;i<labs.length;i++){
      var lab = labs[i];
      if (!/^years of service/i.test((lab.textContent||'').trim())) continue;
      var id = lab.getAttribute('for'); if (!id) continue;
      var input = document.getElementById(id); if (!input) continue;
      var box = input.parentElement;
      if (!box || box.classList.contains('kap-stepped')) continue;
      box.classList.add('kap-stepped');
      var minus = document.createElement('button'); minus.type='button'; minus.className='kap-step';
      minus.textContent='−'; minus.setAttribute('aria-label','Decrease years of service');
      var plus = document.createElement('button'); plus.type='button'; plus.className='kap-step';
      plus.textContent='+'; plus.setAttribute('aria-label','Increase years of service');
      (function(inp){
        minus.onclick = function(){ bump(inp, -1); };
        plus.onclick  = function(){ bump(inp, +1); };
        inp.addEventListener('keydown', function(e){
          if (e.key==='ArrowUp'){ e.preventDefault(); bump(inp, +1); }
          if (e.key==='ArrowDown'){ e.preventDefault(); bump(inp, -1); }
        });
      })(input);
      box.insertBefore(minus, box.firstChild);
      box.appendChild(plus);
    }
  }
  new MutationObserver(enhance).observe(document.getElementById('root'), {childList:true, subtree:true});
  enhance();
})();
</script>

<script id="kap-paydata">
/* ============================================================
   CENTRAL PAY DATA — window.KapPayData
   The single source of military compensation data for every
   injected tool (Future Pay, Summary career projection). It is
   parsed AT RUNTIME from the toolkit's own compiled bundle —
   the same 2026 pay table, typical-progression tables, and BAS
   rates the app's calculators use — so there is exactly ONE
   pay table in this product. Rebuild the app → this picks up
   the new data automatically. If parsing ever fails (bundle
   format change), KapPayData is null and dependent tools show
   an explicit "pay data unavailable" state instead of guessing.
   ============================================================ */
(function(){
  'use strict';
  var s = '';
  var scripts = document.querySelectorAll('script');
  for (var i=0;i<scripts.length;i++){
    var t = scripts[i].textContent || '';
    if (t.indexOf('"E-1":{"<2"') > -1){ s = t; break; }
  }
  var data = null;
  try {
    var m = /\{"E-1":\{"<2":[\s\S]*?"O-10":\{[^{}]*\}\}/.exec(s);
    var table = JSON.parse(m[0].replace(/([{,])(\d+(?:\.\d+)?):/g, '$1"$2":'));
    function arr(re){
      var mm = re.exec(s);
      return mm ? JSON.parse(mm[0].replace(/,\s*\./g, ',0.')) : null;
    }
    var prog = {
      E:  arr(/\[\["E-1",0\],\["E-2",[^\]]+\][\s\S]*?\["E-9",[\d.]+\]\]/),
      W:  arr(/\[\["W-1",0\],[\s\S]*?\["W-5",[\d.]+\]\]/),
      O:  arr(/\[\["O-1",0\],[\s\S]*?\["O-6",[\d.]+\]\]/),
      OE: arr(/\[\["O-1E",0\],[\s\S]*?\["O-6",[\d.]+\]\]/)
    };
    var basm = /Officer \$([\d.]+) \/ enlisted \$([\d.]+)/.exec(s);
    data = {
      effective: '2026-01-01',
      grades: Object.keys(table),
      bas: basm ? { officer:+basm[1], enlisted:+basm[2] } : null,
      basePay: function(grade, yos){
        var g = table[grade]; if (!g) return null;
        if (yos < 2) return g['<2'];
        var best = null;
        for (var k in g){ if (k !== '<2' && +k <= yos && (best === null || +k > best)) best = +k; }
        return best === null ? g['<2'] : g[String(best)];
      },
      trackFor: function(grade){
        if (/^O-\dE$/.test(grade)) return prog.OE;
        if (grade.charAt(0)==='E') return prog.E;
        if (grade.charAt(0)==='W') return prog.W;
        return prog.O;
      },
      /* mirrors the app's own progression engine: promote when years-from-now
         reaches the delta between typical time-in-service points. TYPICAL
         points for planning — never a guarantee. */
      progressGrade: function(grade, yearsFromNow){
        var track = this.trackFor(grade); if (!track) return grade;
        var r = -1;
        for (var i=0;i<track.length;i++) if (track[i][0]===grade) r = i;
        if (r < 0) return grade;
        var a = track[r][1], out = grade;
        for (var o=r+1;o<track.length;o++) if (yearsFromNow >= track[o][1]-a) out = track[o][0];
        return out;
      }
    };
    /* sanity check — if any core piece failed, declare the whole thing unavailable */
    if (!data.basePay('E-5',4) || !prog.E || !prog.O) data = null;
  } catch(e){ data = null; }
  window.KapPayData = data;
})();
</script>

<script id="kap-career">
/* ============================================================
   FUTURE PAY PROJECTION — Career & Moves planning tool.
   Answers: "what does my financial future potentially look
   like if I continue on this path?" All pay values come from
   window.KapPayData (the app's own bundled 2026 table — one
   source of truth). Every projected figure is labeled
   PROJECTED; promotion assumptions are explicit and user-
   controlled, never silent. State: localStorage kap.futurepay.v1
   (same {state:{...}} envelope as the app's stores, so the
   Summary engine reads it with the same helper).
   ============================================================ */
(function(){
  'use strict';
  var PD = window.KapPayData;
  var usd = function(n){ return '$' + Math.round(n).toLocaleString('en-US'); };
  var HORIZONS = [1,3,5,10];
  function on(){ return window.__kapFpOn === true; }
  function load(){
    try { var raw = localStorage.getItem('kap.futurepay.v1'); if (raw) return JSON.parse(raw).state || {}; } catch(e){}
    return {};
  }
  function save(S){ try { localStorage.setItem('kap.futurepay.v1', JSON.stringify({state:S})); } catch(e){} }
  function payStore(){
    try { var raw = localStorage.getItem('mft.pay-calculator.v1'); if (raw) return JSON.parse(raw).state || null; } catch(e){}
    return null;
  }
  var S = load();
  function defaults(){
    var p = payStore();
    if (!S.grade){ S.grade = (p && p.grade) || 'E-5'; S.fromPay = !!(p && p.grade); }
    if (S.yos === undefined) S.yos = (p && +p.yearsOfService) || 4;
    if (!S.horizon) S.horizon = 5;
    if (!S.method) S.method = 'prog';
  }
  function gradeOptions(sel){
    if (!PD) return '';
    var groups = [['Enlisted', /^E-/],['Warrant Officer', /^W-/],['Officer (prior enlisted)', /^O-\dE$/],['Officer', /^O-\d+$/]];
    return groups.map(function(g){
      var opts = PD.grades.filter(function(x){ return g[1].test(x); });
      if (!opts.length) return '';
      return '<optgroup label="'+g[0]+'">'+opts.map(function(o){
        return '<option value="'+o+'"'+(o===sel?' selected':'')+'>'+o+'</option>'; }).join('')+'</optgroup>';
    }).join('');
  }
  function futureGrade(years){
    if (S.method==='stay') return S.grade;
    if (S.method==='custom') return years >= horizon() ? (S.customGrade || S.grade) : (S.grade);
    return PD.progressGrade(S.grade, years);
  }
  function horizon(){ return S.horizon==='custom' ? Math.max(1, Math.min(30, Math.round(+S.customYears||5))) : +S.horizon; }

  function render(){
    var mainEl = document.querySelector('#root main');
    if (!mainEl) return;
    var host = document.getElementById('kap-fp-host');
    if (!host){ host = document.createElement('div'); host.id='kap-fp-host'; mainEl.parentElement.insertBefore(host, mainEl); }
    var active = on();
    document.body.classList.toggle('kap-fp', active);
    if (!active) return;
    defaults();
    if (!PD){
      host.innerHTML = '<div class="kap-fp-card"><div class="kick">FUTURE PAY PROJECTION</div>'+
        '<p style="font-size:.9rem">Pay data is unavailable in this build — the bundled pay table could not be read. '+
        'Your current pay is always available in the <a href="#/pay" style="color:var(--gold)">Pay calculator</a>.</p></div>';
      return;
    }
    var yrs = horizon();
    var g0 = S.grade, y0 = Math.max(0, Math.min(40, Math.round(+S.yos||0)));
    var gF = futureGrade(yrs), yF = Math.min(40, y0 + yrs);
    var p0 = PD.basePay(g0, y0), pF = PD.basePay(gF, yF);
    var diff = (pF||0) - (p0||0);
    var isOff = function(g){ return g.charAt(0)!=='E'; };
    var year0 = new Date().getFullYear();

    var h = '<div class="kap-fp-card">' +
      '<div class="kick">CAREER &amp; MOVES · FUTURE PAY PROJECTION <span class="kap-fp-badge">PROJECTED — FOR PLANNING</span></div>' +
      '<h2>Project Your Future Military Pay</h2>' +
      '<p style="font-size:.88rem;color:var(--muted);margin:0 0 16px">What does your financial future potentially look like if you continue on this path? Built on the same 2026 pay table as the Pay calculator'+(S.fromPay?' — your grade and years of service were pre-filled from your Pay entries':'')+'.</p>' +
      '<div class="kap-fp-grid">' +
      '<div class="kap-fp-field"><label>Current pay grade</label><select id="fp-grade">'+gradeOptions(g0)+'</select></div>' +
      '<div class="kap-fp-field"><label>Current years of service</label>' +
        '<div class="kap-fp-step"><button type="button" class="kap-step" id="fp-yos-minus" aria-label="Decrease">−</button>' +
        '<input id="fp-yos" inputmode="numeric" value="'+y0+'">' +
        '<button type="button" class="kap-step" id="fp-yos-plus" aria-label="Increase">+</button></div></div>' +
      '</div>' +
      '<div style="margin-top:16px"><label style="display:block;font-size:.83rem;font-weight:500;color:#374151;margin-bottom:6px">How far into the future?</label>' +
      '<div class="kap-fp-chips">' + HORIZONS.map(function(hz){
        return '<button type="button" class="kap-chip'+(S.horizon===hz?' on':'')+'" data-fp-hz="'+hz+'">'+hz+' year'+(hz>1?'s':'')+'</button>'; }).join('') +
      '<button type="button" class="kap-chip'+(S.horizon==='custom'?' on':'')+'" data-fp-hz="custom">Custom</button>' +
      (S.horizon==='custom' ? '<input id="fp-custyrs" inputmode="numeric" value="'+(S.customYears||5)+'" style="width:70px;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit"> years' : '') +
      '</div></div>' +
      '<div style="margin-top:16px"><label style="display:block;font-size:.83rem;font-weight:500;color:#374151;margin-bottom:6px">Projection method — the promotion assumption is yours to choose</label>' +
      '<div class="kap-fp-chips">' +
      '<button type="button" class="kap-chip'+(S.method==='stay'?' on':'')+'" data-fp-m="stay">Stay at current grade</button>' +
      '<button type="button" class="kap-chip'+(S.method==='prog'?' on':'')+'" data-fp-m="prog">Estimated career progression</button>' +
      '<button type="button" class="kap-chip'+(S.method==='custom'?' on':'')+'" data-fp-m="custom">Choose future grade</button>' +
      (S.method==='custom' ? '<select id="fp-custgrade" style="padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit">'+gradeOptions(S.customGrade||g0)+'</select>' : '') +
      '</div>' +
      (S.method==='prog' ? '<p class="kap-fp-note" style="margin-top:8px">Uses typical time-in-service promotion points for planning purposes. Actual promotions, timing, and compensation vary by branch, career field, and performance.</p>' : '') +
      '</div></div>';

    if (p0 && pF){
      h += '<div class="kap-fp-card"><h3>Current vs. Projected</h3><div class="kap-fp-stats">' +
        '<div class="kap-fp-stat"><div class="n">'+usd(p0)+'<span style="font-size:.8rem">/mo</span></div><div class="l">Current base pay (2026 table)</div><div class="s">'+g0+' · '+y0+' yrs of service</div></div>' +
        '<div class="kap-fp-stat"><div class="n">'+usd(pF)+'<span style="font-size:.8rem">/mo</span></div><div class="l">Projected base pay — in '+yrs+' year'+(yrs>1?'s':'')+'</div><div class="s">'+gF+' · '+yF+' yrs of service'+(S.method==='prog'&&gF!==g0?' · assumes typical progression':'')+'</div></div>' +
        '<div class="kap-fp-stat gold"><div class="n">'+(diff>=0?'+':'−')+usd(Math.abs(diff))+'<span style="font-size:.8rem">/mo</span></div><div class="l">Projected difference</div><div class="s">'+(diff>=0?'+':'−')+usd(Math.abs(diff)*12)+'/year</div></div>' +
        '</div>' +
        '<p class="kap-fp-note" style="margin-top:12px">Projections apply today\'s 2026 pay table to your future grade and years of service. Annual military pay raises are <b>not</b> included, so future nominal pay will likely be higher than shown.</p></div>';

      /* trajectory ladder */
      var steps = [0].concat(HORIZONS.filter(function(x){ return x!==0; }));
      if (steps.indexOf(yrs)===-1) steps.push(yrs);
      steps.sort(function(a,b){ return a-b; });
      h += '<div class="kap-fp-card"><h3>Your Projected Trajectory</h3>' +
        '<div class="kap-fp-ladder">' + steps.map(function(t){
          var g = t===0 ? g0 : futureGrade(t), y = Math.min(40, y0+t), pay = PD.basePay(g, y);
          return '<div class="kap-fp-rung'+(t===0?' now':'')+'"><span class="yr">'+(t===0?'NOW ('+year0+')':'+'+t+' YRS ('+(year0+t)+')')+'</span>' +
            '<span class="gr">'+g+'</span><span style="font-size:.78rem;color:var(--muted)">'+y+' yrs svc</span>' +
            '<span class="pay">'+(pay?usd(pay)+'/mo':'—')+'</span></div>';
        }).join('') + '</div>' +
        '<p class="kap-fp-note" style="margin-top:10px">'+(S.method==='stay'?'Held at '+g0+' per your selection.':S.method==='custom'?'Shows '+g0+' until your chosen horizon, then your selected future grade.':'Grade steps follow typical time-in-service points — actual timing varies.')+'</p></div>';

      /* scenario comparison at the chosen horizon */
      var track = PD.trackFor(g0), idx = -1;
      for (var ti=0;ti<track.length;ti++) if (track[ti][0]===g0) idx = ti;
      var nextGrade = (idx>-1 && idx<track.length-1) ? track[idx+1][0] : null;
      var scen = [ ['Stay at current grade', g0, PD.basePay(g0, yF)] ];
      if (nextGrade) scen.push(['Promote to next grade', nextGrade, PD.basePay(nextGrade, yF)]);
      var progG = PD.progressGrade(g0, yrs);
      if (progG!==g0 && progG!==nextGrade) scen.push(['Typical progression', progG, PD.basePay(progG, yF)]);
      if (S.method==='custom' && S.customGrade && S.customGrade!==g0 && S.customGrade!==nextGrade && S.customGrade!==progG)
        scen.push(['Your selected grade', S.customGrade, PD.basePay(S.customGrade, yF)]);
      h += '<div class="kap-fp-card"><h3>Scenarios — In '+yrs+' Year'+(yrs>1?'s':'')+' ('+yF+' Yrs Of Service)</h3><table>' +
        '<tr><th>Scenario</th><th>Grade</th><th class="num">Projected monthly</th><th class="num kap-fp-annual">Projected annual</th></tr>' +
        scen.map(function(sc){ return '<tr><td>'+sc[0]+'</td><td><b>'+sc[1]+'</b></td><td class="num">'+(sc[2]?usd(sc[2]):'—')+'</td><td class="num kap-fp-annual">'+(sc[2]?usd(sc[2]*12):'—')+'</td></tr>'; }).join('') +
        '</table><p class="kap-fp-note" style="margin-top:10px">Base pay only. Approvals, promotion boards, and high-year-tenure rules are outside any calculator.</p></div>';

      /* beyond base pay — only what the data supports */
      h += '<div class="kap-fp-card"><h3>Beyond Base Pay</h3><table>' +
        '<tr><td>BAS — '+(isOff(gF)?'officer':'enlisted')+' rate <span class="kap-fp-note">(2026 rate held constant)</span></td><td class="num">'+(PD.bas?usd(isOff(gF)?PD.bas.officer:PD.bas.enlisted)+'/mo':'data unavailable')+'</td></tr>' +
        '<tr><td>BAH <span class="kap-fp-note">— depends on future duty station, grade, and dependents; not projected. Model today\'s in the <a href="#/pay" style="color:var(--gold)">Pay calculator</a></span></td><td class="num">—</td></tr>' +
        '<tr><td>Special &amp; incentive pays <span class="kap-fp-note">— career-field specific; not projected</span></td><td class="num">—</td></tr>' +
        '</table></div>';

      /* milestones + separation planning */
      var toRet = 20 - y0;
      var nextTyp = '';
      if (nextGrade && idx>-1){
        var yearsToTyp = track[idx+1][1] - track[idx][1];
        nextTyp = '<tr><td>Next grade ('+nextGrade+') — typical time-in-service point</td><td class="num">'+(yearsToTyp>0?'~'+yearsToTyp+' yr'+(yearsToTyp>1?'s':''):'—')+'</td></tr>';
      }
      h += '<div class="kap-fp-card"><h3>Career Milestones</h3><table>' +
        (toRet>0 ? '<tr><td>20-year retirement eligibility <span class="kap-fp-note">(estimated from your years of service)</span></td><td class="num">in ~'+toRet+' yrs ('+(year0+toRet)+')</td></tr>'
                 : '<tr><td>20-year retirement eligibility</td><td class="num">reached ✓</td></tr>') +
        nextTyp +
        '</table>' +
        '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:.85rem;font-weight:600">Planning to separate? Enter a date for a countdown + checklist</summary>' +
        '<div style="margin-top:10px" class="kap-fp-field"><label>Planned separation date</label><input type="date" id="fp-sep" value="'+(S.sepDate||'')+'" style="max-width:220px"></div>' +
        (S.sepDate ? (function(){
          var d = new Date(S.sepDate+'T12:00:00'); if (isNaN(d)) return '';
          var mo = Math.max(0, Math.round((d - new Date())/2629800000));
          return '<p style="font-size:.9rem;margin:10px 0 6px"><b>'+mo+' month'+(mo===1?'':'s')+' remaining.</b> Financial transition checklist:</p>' +
            '<ul style="font-size:.85rem;color:var(--muted);margin:0;padding-left:20px;line-height:1.7">'+
            '<li>Build 3–6 months of civilian-cost expenses (see <a href="#/budget" style="color:var(--gold)">Budget</a>)</li>'+
            '<li>Review TSP: contribution options end with active pay (see <a href="#/tsp" style="color:var(--gold)">TSP / BRS</a>)</li>'+
            '<li>Compare civilian offers against your full military compensation (see <a href="#/civilian-pay" style="color:var(--gold)">Civilian Pay</a>)</li>'+
            '<li>Document every medical condition before you leave (see <a href="#/va-disability" style="color:var(--gold)">VA Disability</a>)</li>'+
            '<li>Plan healthcare transition (TAMP/VA/employer coverage)</li>'+
            '<li>Decide housing: VA loan eligibility continues after separation (see <a href="#/rent-vs-buy" style="color:var(--gold)">Rent vs. Buy</a>)</li></ul>';
        })() : '') +
        '</details></div>';
    } else {
      h += '<div class="kap-fp-card"><p style="font-size:.9rem">No pay-table entry for that grade / years-of-service combination — adjust the inputs above.</p></div>';
    }
    h += '<p class="kap-fp-note" style="margin:2px 4px">Military pay tables, promotions, allowances, and individual circumstances change. These are base-pay projections for planning purposes only — verify current compensation through official military resources (DFAS, your finance office). Not financial advice.</p>';
    host.innerHTML = h;
    wire(host);
  }

  function wire(host){
    var q = function(id){ return host.querySelector(id); };
    q('#fp-grade').onchange = function(){ S.grade = this.value; S.fromPay = false; save(S); render(); };
    var yosI = q('#fp-yos');
    function setYos(v){ if (!isFinite(v)) v = 0; S.yos = Math.max(0, Math.min(40, Math.round(v))); save(S); render(); }
    yosI.onchange = function(){ setYos(parseFloat(this.value)); };
    yosI.onkeydown = function(e){
      if (e.key==='ArrowUp'){ e.preventDefault(); setYos((+S.yos||0)+1); }
      if (e.key==='ArrowDown'){ e.preventDefault(); setYos((+S.yos||0)-1); }
      if (e.key==='Enter'){ e.preventDefault(); setYos(parseFloat(this.value)); }
    };
    q('#fp-yos-minus').onclick = function(){ setYos((+S.yos||0)-1); };
    q('#fp-yos-plus').onclick = function(){ setYos((+S.yos||0)+1); };
    host.querySelectorAll('[data-fp-hz]').forEach(function(b){
      b.onclick = function(){ S.horizon = b.dataset.fpHz==='custom' ? 'custom' : +b.dataset.fpHz; save(S); render(); };
    });
    var cy = q('#fp-custyrs'); if (cy) cy.onchange = function(){ S.customYears = Math.max(1, Math.min(30, Math.round(+this.value||5))); save(S); render(); };
    host.querySelectorAll('[data-fp-m]').forEach(function(b){
      b.onclick = function(){ S.method = b.dataset.fpM; if (S.method==='custom' && !S.customGrade) S.customGrade = S.grade; save(S); render(); };
    });
    var cg = q('#fp-custgrade'); if (cg) cg.onchange = function(){ S.customGrade = this.value; save(S); render(); };
    var sep = q('#fp-sep'); if (sep) sep.onchange = function(){ S.sepDate = this.value; save(S); render(); };
  }

  window.addEventListener('hashchange', function(){ setTimeout(render, 60); });
  document.addEventListener('kap-fp-change', function(){ setTimeout(render, 30); });
  /* any '#/future-pay' link anywhere (e.g. the Summary's career card) opens
     the view via the flag — the app router would swallow the bare hash */
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href="#/future-pay"]');
    if (a){ e.preventDefault(); window.__kapFpOn = true; document.dispatchEvent(new CustomEvent('kap-fp-change')); }
  });
  new MutationObserver(function(){ if (!document.getElementById('kap-fp-host')) render(); })
    .observe(document.getElementById('root'), {childList:true, subtree:true});
  render();
})();
</script>
<script id="kap-height">
/* Height reporter: posts content height to the embedding page so the
   frame can size itself in ANY context (same-origin or not). Fixes
   clipped content (e.g. Credit Cards) wherever direct DOM reads fail. */
(function(){
  var last = 0;
  function report(){
    /* measure CONTENT height, never the viewport: documentElement.scrollHeight
       is floored at the iframe's own height, which would ratchet the frame —
       it could grow but never shrink. Take the max of the #root box and
       body.scrollHeight (catches anything flowing outside root), plus a
       small buffer so nothing ever lands exactly on the clip line. */
    var r = document.getElementById('root'), h = 0;
    if (r) h = Math.ceil(r.getBoundingClientRect().bottom + (window.scrollY||0));
    h = Math.max(h, document.body.scrollHeight) + 16;
    if (h > 200 && Math.abs(h-last) > 4){ last = h; try{ parent.postMessage({kapToolkitHeight:h}, '*'); }catch(e){} }
  }
  try{ new ResizeObserver(report).observe(document.body); }catch(e){}
  new MutationObserver(report).observe(document.getElementById('root'), {childList:true, subtree:true, attributes:true});
  document.addEventListener('toggle', report, true);   /* <details> expanders grow instantly */
  window.addEventListener('load', report);
  window.addEventListener('resize', report);           /* reflow at new widths */
  setInterval(report, 1200);
})();
</script>

<script id="kap-report">
/* ================================================================
   KAP SUMMARY ENGINE + REPORT
   Data flow: tool inputs → persisted stores (mft.*) → snapshot()
   → RULES engine → personalized strengths / concerns / action plan
   → in-page report sections + standalone printable report.
   Reads the app's own persisted state — no duplicate inputs, no
   re-implementation of app calculations. Only sections with real
   user data appear; no fake values.
   ================================================================ */
(function(){
  'use strict';
  var $$ = function(sel, root){ return [...(root||document).querySelectorAll(sel)]; };
  function store(key){
    try { var raw = localStorage.getItem(key); return raw ? (JSON.parse(raw).state || null) : null; } catch(e){ return null; }
  }
  function usd(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
  function full(){ try{ return window.KapAccess && window.KapAccess.level()==='full'; }catch(e){ return false; } }

  /* ---------- snapshot: normalized view of everything the user entered ---------- */
  function snapshot(){
    var s = {};
    var pay = store('mft.pay-calculator.v1');
    if (pay) s.pay = { grade: pay.grade, yos: pay.yearsOfService, dependents: pay.hasDependents, state: pay.stateName, filing: pay.filingStatus };
    var b = store('mft.budget.v1');
    if (b && b.monthlyIncome){
      var items = b.items || [];
      var sum = function(g){ return items.filter(function(i){ return i.group===g; }).reduce(function(a,i){ return a + (+i.monthlyAmount||0); }, 0); };
      var total = items.reduce(function(a,i){ return a + (+i.monthlyAmount||0); }, 0);
      var emergency = (items.filter(function(i){ return i.id==='emergency'; })[0]||{}).monthlyAmount || 0;
      s.budget = { income:+b.monthlyIncome, essentials:sum('essentials'), savings:sum('savings'), total:total,
                   net:+b.monthlyIncome-total, emergencyMonthly:+emergency,
                   savingsRate: b.monthlyIncome>0 ? sum('savings')/b.monthlyIncome : 0 };
    }
    var t = store('mft.tsp.v1');
    if (t) s.tsp = { pct:+t.contributionPct, balance:+t.currentBalance, years:+t.yearsToRetirement };
    var p = store('mft.pension.v1');
    if (p) s.pension = { system:p.system, yos:+p.yearsOfService, high3:+p.high3MonthlyBasePay };
    var pcs = store('mft.pcs.v1');
    if (pcs) s.pcs = { grade:pcs.grade, miles:+pcs.officialMiles, vehicles:+pcs.numVehicles, dependents:pcs.hasDependents };
    var d = store('mft.deployment.v1');
    if (d) s.deploy = { sdpMonthly:+d.sdpMonthlyDeposit, sdpMonths:+d.sdpMonths, czMonths:+d.monthsInCombatZone, pay:+d.monthlyMilitaryPay };
    var va = store('mft.va-disability.v1');
    if (va && (va.ratings||[]).length) s.va = { ratings: va.ratings, count: va.ratings.length, spouse: va.hasSpouse };
    var w = store('mft.where-to-retire.v1');
    if (w) s.retire = { pension:+w.militaryPensionMonthly, va:+w.vaDisabilityMonthly, other:+w.otherIncomeMonthly };
    var r = store('mft.rent-vs-buy.v2');
    if (r) s.housing = { price:+r.homePrice, va: !!r.usingVaLoan, rent:+r.monthlyRent, debts:+(r.monthlyDebts||0) };
    /* career projection: Future Pay inputs (or Pay entries as fallback) through
       the central KapPayData table — same source as the Future Pay tool */
    try {
      var pd = window.KapPayData, fp = store('kap.futurepay.v1');
      var cg = (fp && fp.grade) || (pay && pay.grade), cy = fp && fp.yos !== undefined ? +fp.yos : (pay && +pay.yearsOfService);
      if (pd && cg && cy >= 0 && isFinite(cy)){
        var meth = (fp && fp.method) || 'prog';
        var gAt = function(n){ return meth==='stay' ? cg : (meth==='custom' && fp && fp.customGrade ? fp.customGrade : pd.progressGrade(cg, n)); };
        var now = pd.basePay(cg, cy);
        if (now) s.career = { grade:cg, yos:cy, now:now, method:meth,
          g5:gAt(5), in5:pd.basePay(gAt(5), Math.min(40,cy+5)),
          g10:gAt(10), in10:pd.basePay(gAt(10), Math.min(40,cy+10)) };
      }
    } catch(e){}
    return s;
  }

  /* ---------- rules: structured, maintainable, data-conditioned ---------- */
  var TOOL = { budget:['#/budget','Budget'], tsp:['#/tsp','TSP / BRS'], pcs:['#/pcs','PCS'], deploy:['#/deployment','Deployment'],
               va:['#/va-disability','VA Disability'], pension:['#/pension','Pension'], retire:['#/where-to-retire','Where to Retire'],
               housing:['#/rent-vs-buy','Rent vs. Buy'], pay:['#/pay','Pay'] };
  var RULES = [
    { id:'tsp-match', src:'tsp', pr:'high', when:function(s){ return s.tsp && s.tsp.pct>=0 && s.tsp.pct<5; },
      title:'Capture your full BRS match',
      why:function(s){ return 'You entered a '+s.tsp.pct+'% TSP contribution. The BRS match tops out at 5% — below that you are leaving matching dollars unclaimed every month.'; },
      act:function(s){ return 'Raise your contribution from '+s.tsp.pct+'% to at least 5% to capture the full available match.'; } },
    { id:'budget-deficit', src:'budget', pr:'high', when:function(s){ return s.budget && s.budget.net<0; },
      title:'Close your monthly budget gap',
      why:function(s){ return 'Your entered expenses exceed your income by '+usd(-s.budget.net)+' per month — that gap compounds into debt fast.'; },
      act:function(s){ return 'Trim '+usd(-s.budget.net)+'/month, starting from non-essential categories in your budget.'; } },
    { id:'emergency', src:'budget', pr:'high', when:function(s){ return s.budget && s.budget.emergencyMonthly<=0 && s.budget.net>=0; },
      title:'Start your emergency fund',
      why:function(s){ return 'Your budget shows no monthly emergency-fund contribution. Your essentials run '+usd(s.budget.essentials)+'/month — a 3–6 month cushion is '+usd(s.budget.essentials*3)+'–'+usd(s.budget.essentials*6)+'.'; },
      act:function(s){ return 'Automate a monthly transfer toward a '+usd(s.budget.essentials*3)+' starter cushion.'; } },
    { id:'savings-rate', src:'budget', pr:'rec', when:function(s){ return s.budget && s.budget.savingsRate>0 && s.budget.savingsRate<0.10; },
      title:'Push your savings rate toward 10–15%',
      why:function(s){ return 'You are saving about '+Math.round(s.budget.savingsRate*100)+'% of income. 10–15% is the range that builds real long-term wealth on a military paycheck.'; },
      act:function(s){ return 'Increase automated savings by '+usd(Math.max(0, s.budget.income*0.10 - s.budget.savings))+'/month to reach 10%.'; } },
    { id:'pcs-reserve', src:'pcs', pr:'rec', when:function(s){ return !!s.pcs; },
      title:'Prepare for your PCS move',
      why:function(s){ return 'You are planning a '+(s.pcs.miles? s.pcs.miles.toLocaleString()+'-mile ' : '')+'PCS'+(s.pcs.dependents?' with dependents':'')+'. Reimbursements lag expenses — cash buffers prevent the move going on a credit card.'; },
      act:function(){ return 'Build a dedicated PCS cash reserve and review your DLA, MALT, and per-diem entitlements in the PCS tool before you move.'; } },
    { id:'deploy-sdp', src:'deploy', pr:'rec', when:function(s){ return s.deploy && s.deploy.czMonths>0 && (s.deploy.sdpMonthly*Math.min(s.deploy.sdpMonths,s.deploy.czMonths) < 10000); },
      title:'Maximize your SDP during deployment',
      why:function(s){ return 'The Savings Deposit Program pays 10% guaranteed on up to $10,000 while deployed. Your entries put '+usd(s.deploy.sdpMonthly*Math.min(s.deploy.sdpMonths,s.deploy.czMonths))+' in — short of the cap.'; },
      act:function(){ return 'Front-load SDP deposits toward the $10,000 cap as early in the deployment as cash flow allows.'; } },
    { id:'deploy-prep', src:'deploy', pr:'rec', when:function(s){ return s.deploy && s.deploy.czMonths>0; },
      title:'Run your pre-deployment financial checklist',
      why:function(){ return 'Deployed months are the cheapest months of a career — CZTE makes pay tax-free and expenses drop.'; },
      act:function(){ return 'Automate savings, review recurring charges, verify SGLI beneficiaries, and set up account access before you leave.'; } },
    { id:'va-doc', src:'va', pr:'rec', when:function(s){ return !!s.va; },
      title:'Document your VA disability claim early',
      why:function(s){ return 'You entered '+s.va.count+' condition rating'+(s.va.count>1?'s':'')+'. Ratings depend on documentation — records gathered while serving are far easier than after separation.'; },
      act:function(){ return 'Get every condition into your medical record now and keep copies; review your projected compensation in the VA Disability tool.'; } },
    { id:'housing-va', src:'housing', pr:'rec', when:function(s){ return s.housing && s.housing.price>0 && !s.housing.va; },
      title:'Price your purchase with a VA loan',
      why:function(){ return 'Your Rent vs. Buy scenario is modeled without a VA loan. VA financing removes the down-payment barrier and PMI entirely.'; },
      act:function(){ return 'Re-run the Rent vs. Buy tool with the VA loan option to see the zero-down math before deciding.'; } },
    { id:'pension-model', src:'pension', pr:'long', when:function(s){ return !!s.pension; },
      title:function(s){ return s.pension.yos>=15 ? 'Protect your pension runway' : 'Model your pension milestones'; },
      why:function(s){ return 'At '+s.pension.yos+' years of service under '+(s.pension.system==='brs'?'BRS':'High-3')+', your pension math changes meaningfully with each year served past key gates.'; },
      act:function(){ return 'Use the Pension tool to compare separation dates — small timeline shifts can change lifetime value dramatically.'; } },
    { id:'retire-state', src:'retire', pr:'long', when:function(s){ return !!s.retire; },
      title:'Pick your retirement state deliberately',
      why:function(s){ return 'With '+usd((s.retire.pension||0)+(s.retire.va||0)+(s.retire.other||0))+'/month of projected retirement income entered, state tax treatment changes your effective income by thousands per year.'; },
      act:function(){ return 'Shortlist 2–3 states in the Where to Retire tool and compare their military-retirement tax treatment side by side.'; } },
    { id:'tsp-horizon', src:'tsp', pr:'long', when:function(s){ return s.tsp && s.tsp.years>=15 && s.tsp.pct>=5; },
      title:'Let your TSP horizon work',
      why:function(s){ return 'With '+s.tsp.years+' years to retirement and the match captured, contribution increases now compound the longest.'; },
      act:function(){ return 'Step contributions up 1% each promotion or pay raise — you will not feel it, your balance will.'; } }
  ];
  var STRENGTHS = [
    { when:function(s){ return s.tsp && s.tsp.pct>=5; }, text:function(s){ return 'Capturing your full BRS match — your '+s.tsp.pct+'% TSP contribution clears the 5% match threshold.'; } },
    { when:function(s){ return s.budget && s.budget.net>0; }, text:function(s){ return 'Running a monthly surplus of '+usd(s.budget.net)+' — you spend less than you make.'; } },
    { when:function(s){ return s.budget && s.budget.savingsRate>=0.15; }, text:function(s){ return 'Saving '+Math.round(s.budget.savingsRate*100)+'% of income — well above the 10–15% wealth-building range.'; } },
    { when:function(s){ return s.budget && s.budget.emergencyMonthly>0; }, text:function(s){ return 'Funding your emergency cushion with '+usd(s.budget.emergencyMonthly)+'/month, automatically.'; } },
    { when:function(s){ return s.housing && s.housing.va; }, text:function(){ return 'Using your VA loan benefit — zero down, no PMI, one of the strongest advantages you have earned.'; } },
    { when:function(s){ return s.deploy && s.deploy.czMonths>0 && s.deploy.sdpMonthly*Math.min(s.deploy.sdpMonths,s.deploy.czMonths)>=10000; }, text:function(){ return 'Maxing the Savings Deposit Program — 10% guaranteed on the full $10,000 cap.'; } },
    { when:function(s){ return s.pension && s.pension.yos>=15; }, text:function(s){ return s.pension.yos+' years toward your pension — the finish line math is on your side.'; } }
  ];
  var CAPS = { high:3, rec:4, long:3, total:8 };

  function evaluate(s){
    var out = { high:[], rec:[], long:[] }, total = 0;
    RULES.forEach(function(r){
      try {
        if (total < CAPS.total && out[r.pr].length < CAPS[r.pr] && r.when(s)){
          out[r.pr].push({ id:r.id, src:r.src, title: (typeof r.title==='function'? r.title(s) : r.title), why:r.why(s), act:r.act(s) });
          total++;
        }
      } catch(e){}
    });
    out.total = total;
    return out;
  }
  function strengths(s){
    var out = [];
    STRENGTHS.forEach(function(r){ try{ if (out.length<5 && r.when(s)) out.push(r.text(s)); }catch(e){} });
    return out;
  }
  function readScore(){
    var leaf = $$('main *').filter(function(e){ return e.children.length===0 && /^FINANCIAL READINESS$/i.test((e.textContent||'').trim()); })[0];
    if (!leaf) return null;
    var card = leaf.closest('section,div');
    var m = (card ? card.textContent : '').match(/(\d{1,3})\s*\/\s*100\s*([A-Za-z ]{2,20})/);
    return m ? { value:+m[1], label:m[2].trim() } : null;
  }
  function snapRows(s){
    var rows = [];
    if (s.pay) rows.push(['Pay grade', s.pay.grade], ['Years of service', s.pay.yos], ['Duty state', s.pay.state||'—']);
    if (s.budget) rows.push(['Monthly income', usd(s.budget.income)], ['Essential expenses', usd(s.budget.essentials)+'/mo'], ['Monthly surplus', (s.budget.net<0?'−':'')+usd(Math.abs(s.budget.net))]);
    if (s.tsp) rows.push(['TSP contribution', s.tsp.pct+'%'], ['TSP balance', usd(s.tsp.balance)]);
    if (s.pension) rows.push(['Retirement system', s.pension.system==='brs'?'BRS':'High-3'], ['Pension years', s.pension.yos]);
    if (s.deploy && s.deploy.czMonths>0) rows.push(['Combat-zone months', s.deploy.czMonths]);
    if (s.pcs) rows.push(['PCS planned', s.pcs.miles ? s.pcs.miles.toLocaleString()+' miles' : 'Yes']);
    if (s.va) rows.push(['VA conditions entered', s.va.count]);
    if (s.housing) rows.push(['Housing scenario', s.housing.va ? 'Buying (VA loan)' : (s.housing.price>0?'Buying (conventional)':'Renting')]);
    if (s.retire) rows.push(['Projected retirement income', usd((s.retire.pension||0)+(s.retire.va||0)+(s.retire.other||0))+'/mo']);
    return rows;
  }
  var TIERS = [['high','🔴 High Priority'],['rec','🟡 Recommended'],['long','🟢 Long-Term']];

  /* ---------- in-page summary report ---------- */
  function anchorCard(){
    var leaf = $$('main *').filter(function(e){ return e.children.length===0 && /^FINANCIAL READINESS$/i.test((e.textContent||'').trim()); })[0];
    if (!leaf) return null;
    var el = leaf, tips = $$('main *').filter(function(e){ return e.children.length===0 && /^TIPS TO IMPROVE$/i.test((e.textContent||'').trim()); })[0];
    while (el.parentElement && !(tips && el.contains(tips))) el = el.parentElement;
    return el;
  }
  function render(){
    var onSummary = (location.hash||'').indexOf('#/summary')===0 || (location.hash||'').replace('#','').indexOf('/summary')===0;
    document.body.classList.toggle('kap-noprint', !!onSummary);
    var box = document.getElementById('kap-rep'), tz = document.getElementById('kap-teaser');
    if (!onSummary){ if (box) box.remove(); if (tz) tz.remove(); return; }
    var s = snapshot(), plan = evaluate(s), sts = strengths(s), card = anchorCard();
    if (!card) return;
    var sig = JSON.stringify([full(), plan, sts, snapRows(s)]);
    if (!full()){
      if (box) box.remove();
      if (plan.total > 0){
        if (!tz){ tz = document.createElement('div'); tz.id='kap-teaser'; tz.className='kap-teaser';
          card.parentElement.insertBefore(tz, card.nextElementSibling); }
        tz.innerHTML = 'Based on what you’ve entered, <b>'+plan.total+' area'+(plan.total>1?'s':'')+' could improve your financial position</b> — plus '+
          (sts.length||'your')+' strength'+(sts.length===1?'':'s')+' worth protecting. 🔒 Your personalized action plan is part of Full Access.';
      } else if (tz) tz.remove();
      return;
    }
    if (tz) tz.remove();
    /* always retire the app's raw print button in favor of the report (re-renders included) */
    $$('main button').forEach(function(b){ if (/print/i.test(b.textContent) && b.id!=='kap-print') b.classList.add('kap-hide'); });
    if (box && box.dataset.sig === sig) return;
    if (box) box.remove();
    box = document.createElement('div'); box.id='kap-rep'; box.className='kap-rep'; box.dataset.sig = sig;
    var html = '';
    var rows = snapRows(s);
    if (rows.length){
      html += '<div class="kap-rep-card"><div class="kick">FINANCIAL SNAPSHOT — WHAT YOU TOLD US</div><div class="kap-snap">' +
        rows.map(function(r){ return '<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'; }).join('') + '</div></div>';
    }
    if (s.career){
      html += '<div class="kap-rep-card"><div class="kick">CAREER PROJECTION — PROJECTED, NOT GUARANTEED</div><div class="kap-snap">' +
        '<div><span>Current base pay ('+s.career.grade+' · '+s.career.yos+' yrs)</span><b>'+usd(s.career.now)+'/mo</b></div>' +
        (s.career.in5?'<div><span>5-yr projected ('+s.career.g5+')</span><b>'+usd(s.career.in5)+'/mo</b></div>':'') +
        (s.career.in10?'<div><span>10-yr projected ('+s.career.g10+')</span><b>'+usd(s.career.in10)+'/mo</b></div>':'') +
        '</div><p style="font-size:.72rem;color:var(--muted);margin:10px 0 0">'+
        (s.career.method==='stay'?'Held at your current grade per your Future Pay setting.':s.career.method==='custom'?'Uses the future grade you selected in Future Pay.':'Assumes typical career progression — actual promotions and timing vary.')+
        ' Today\'s 2026 pay table; annual raises not included. Tune the assumptions in <a href="#/future-pay" style="color:var(--gold)">Future Pay</a>.</p></div>';
    }
    if (sts.length){
      html += '<div class="kap-rep-card"><div class="kick">WHAT YOU’RE DOING WELL</div>' +
        sts.map(function(t){ return '<div class="kap-li">'+t+'</div>'; }).join('') + '</div>';
    }
    var concerns = plan.high.concat(plan.rec);
    if (concerns.length){
      html += '<div class="kap-rep-card"><div class="kick">AREAS THAT NEED ATTENTION</div>' +
        concerns.map(function(a){ return '<div class="kap-li warn">'+a.title+'<small>'+a.why+'</small></div>'; }).join('') + '</div>';
    }
    if (plan.total){
      html += '<div class="kap-rep-card"><div class="kick">YOUR ACTION PLAN — THE '+plan.total+' THINGS THAT MATTER MOST</div>';
      TIERS.forEach(function(t){
        plan[t[0]].forEach(function(a){
          var tool = TOOL[a.src];
          html += '<div class="kap-act '+t[0]+'"><div class="tier">'+t[1]+'</div><h4>'+a.title+'</h4>' +
            '<p>'+a.act+'</p><p class="why">'+a.why+'</p>' +
            '<p class="src">From your <a href="'+tool[0]+'">'+tool[1]+'</a> entries</p></div>';
        });
      });
      html += '</div>';
    }
    html += '<div style="text-align:center;margin:6px 0 10px"><button type="button" class="kap-btn" id="kap-print">🖨 Print / Save My Financial Plan</button></div>';
    box.innerHTML = html;
    card.parentElement.insertBefore(box, card.nextElementSibling);
    document.getElementById('kap-print').onclick = printReport;
    /* our report supersedes the app's raw print button */
    $$('main button').forEach(function(b){ if (/print/i.test(b.textContent) && b.id!=='kap-print') b.classList.add('kap-hide'); });
  }

  /* ---------- standalone printable report (built from data, not DOM) ---------- */
  function printReport(){
    var s = snapshot(), plan = evaluate(s), sts = strengths(s), score = readScore();
    var nameInput = $$('main input[type=text]').filter(function(i){ return /name/i.test(i.placeholder||'') || /jane|name/i.test(i.getAttribute('aria-label')||''); })[0];
    var name = (nameInput && nameInput.value.trim()) || '';
    var today = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    var interp = score ? (score.value>=80 ? 'You are in strong financial shape — protect it and optimize.' :
                  score.value>=60 ? 'A solid base with clear opportunities — the action plan below is your fastest path up.' :
                  'Your finances need attention — start with the high-priority items below.') : '';
    var rows = snapRows(s);
    var css = '@page{margin:18mm 16mm} body{font-family:Georgia,\'Times New Roman\',serif;color:#1a2331;line-height:1.55;font-size:11pt;margin:0}' +
      'h1,h2,h3{font-family:Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#0a2540}' +
      '.hd{border-bottom:3px solid #c8a24a;padding-bottom:10px;margin-bottom:22px}.hd h1{font-size:19pt;margin:0}.hd .sub{color:#5c6a7d;font-size:9.5pt}' +
      'h2{font-size:12pt;border-bottom:1px solid #e2e6ec;padding-bottom:4px;margin:24px 0 10px;page-break-after:avoid}' +
      '.score{font-family:Arial;font-size:34pt;font-weight:bold;color:#0a2540}.score small{font-size:12pt;color:#5c6a7d}' +
      'table{width:100%;border-collapse:collapse;font-size:10pt}td{padding:5px 8px;border-bottom:1px solid #eef1f5}td:last-child{text-align:right;font-weight:bold}' +
      '.item{page-break-inside:avoid;margin:0 0 12px;padding:10px 14px;border-left:3px solid #c8a24a;background:#fafbfc}' +
      '.item.high{border-left-color:#b3202c}.item.long{border-left-color:#0a2540}' +
      '.item h3{font-size:10.5pt;margin:0 0 4px}.item .tier{font-family:Arial;font-size:8pt;letter-spacing:.1em;color:#8a6d2a}' +
      '.item.high .tier{color:#b3202c}.item.long .tier{color:#0a2540}.item p{margin:2px 0;font-size:10pt}.item .why{color:#5c6a7d}' +
      'ul{margin:6px 0;padding-left:18px}li{margin-bottom:5px;page-break-inside:avoid}' +
      '.ft{margin-top:28px;border-top:1px solid #e2e6ec;padding-top:8px;font-size:8pt;color:#8a94a3}';
    var h = '<div class="hd"><h1>Military Financial Assessment</h1><div class="sub">' +
      (name ? 'Prepared for ' + name + ' · ' : '') + today + ' · CAPTAIN KAP — Military Financial Readiness Toolkit</div></div>';
    if (score) h += '<h2>Overall Financial Score</h2><div class="score">' + score.value + '<small> /100 · ' + score.label + '</small></div><p>' + interp + '</p>';
    if (rows.length) h += '<h2>Financial Snapshot</h2><table>' + rows.map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'; }).join('') + '</table>';
    if (sts.length) h += '<h2>Strengths</h2><ul>' + sts.map(function(t){ return '<li>'+t+'</li>'; }).join('') + '</ul>';
    var concerns = plan.high.concat(plan.rec);
    if (concerns.length) h += '<h2>Areas Requiring Attention</h2><ul>' + concerns.map(function(a){ return '<li><b>'+a.title+'.</b> '+a.why+'</li>'; }).join('') + '</ul>';
    if (plan.total){
      h += '<h2>Recommended Action Plan</h2>';
      TIERS.forEach(function(t){
        plan[t[0]].forEach(function(a){
          h += '<div class="item '+t[0]+'"><div class="tier">'+t[1].replace(/^..\s/,'').toUpperCase()+'</div><h3>'+a.title+'</h3>' +
               '<p>'+a.act+'</p><p class="why">'+a.why+' <i>(From your '+TOOL[a.src][1]+' entries.)</i></p></div>';
        });
      });
    }
    /* detailed results per tool — only where data exists */
    var det = '';
    if (s.budget) det += '<h3 style="font-size:10.5pt">Budget</h3><table><tr><td>Monthly income</td><td>'+usd(s.budget.income)+'</td></tr><tr><td>Essentials</td><td>'+usd(s.budget.essentials)+'</td></tr><tr><td>Savings</td><td>'+usd(s.budget.savings)+'</td></tr><tr><td>Surplus / deficit</td><td>'+(s.budget.net<0?'−':'')+usd(Math.abs(s.budget.net))+'</td></tr></table>';
    if (s.tsp) det += '<h3 style="font-size:10.5pt">TSP / BRS</h3><table><tr><td>Contribution</td><td>'+s.tsp.pct+'%</td></tr><tr><td>Balance</td><td>'+usd(s.tsp.balance)+'</td></tr><tr><td>Years to retirement</td><td>'+s.tsp.years+'</td></tr></table>';
    if (s.pension) det += '<h3 style="font-size:10.5pt">Pension</h3><table><tr><td>System</td><td>'+(s.pension.system==='brs'?'BRS':'High-3')+'</td></tr><tr><td>Years of service</td><td>'+s.pension.yos+'</td></tr></table>';
    if (s.deploy && s.deploy.czMonths>0) det += '<h3 style="font-size:10.5pt">Deployment</h3><table><tr><td>Combat-zone months</td><td>'+s.deploy.czMonths+'</td></tr><tr><td>SDP monthly deposit</td><td>'+usd(s.deploy.sdpMonthly)+'</td></tr></table>';
    if (s.va) det += '<h3 style="font-size:10.5pt">VA Disability</h3><table><tr><td>Conditions entered</td><td>'+s.va.count+'</td></tr></table>';
    if (s.retire) det += '<h3 style="font-size:10.5pt">Retirement Income</h3><table><tr><td>Pension</td><td>'+usd(s.retire.pension)+'/mo</td></tr><tr><td>VA disability</td><td>'+usd(s.retire.va)+'/mo</td></tr><tr><td>Other</td><td>'+usd(s.retire.other)+'/mo</td></tr></table>';
    if (s.career) det += '<h3 style="font-size:10.5pt">Career Projection (projected — not guaranteed)</h3><table><tr><td>Current base pay ('+s.career.grade+', '+s.career.yos+' yrs)</td><td>'+usd(s.career.now)+'/mo</td></tr>'+
      (s.career.in5?'<tr><td>5-year projected base pay ('+s.career.g5+')</td><td>'+usd(s.career.in5)+'/mo</td></tr>':'')+
      (s.career.in10?'<tr><td>10-year projected base pay ('+s.career.g10+')</td><td>'+usd(s.career.in10)+'/mo</td></tr>':'')+
      '</table><p style="font-size:8.5pt;color:#5c6a7d;margin:4px 0 0">'+(s.career.method==='stay'?'Held at current grade per your setting.':s.career.method==='custom'?'Uses your selected future grade.':'Assumes typical career progression — actual promotions and timing vary.')+' Today\'s 2026 pay table; annual raises not included.</p>';
    if (det) h += '<h2>Detailed Results</h2>' + det;
    h += '<div class="ft">Estimates only — not financial, tax, or investment advice, and not affiliated with the DoD, DFAS, or VA. Rates effective 2026-01-01. Generated by the Captain Kap Military Financial Readiness Toolkit.</div>';
    /* print via a hidden same-origin iframe — no pop-up window, so pop-up
       blockers never eat the report. The iframe is removed after the dialog. */
    var doc = '<!doctype html><html><head><meta charset="utf-8"><title>Military Financial Assessment' + (name? ' — '+name : '') + '</title><style>'+css+'</style></head><body>'+h+'</body></html>';
    var fr = document.createElement('iframe');
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    fr.onload = function(){ setTimeout(function(){
      try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){}
      setTimeout(function(){ fr.remove(); }, 60000);
    }, 150); };
    document.body.appendChild(fr);
    fr.srcdoc = doc;
  }

  var t; function later(){ clearTimeout(t); t = setTimeout(render, 350); }
  window.addEventListener('hashchange', later);
  document.addEventListener('kap-access-change', later);
  new MutationObserver(function(muts){
    for (var i=0;i<muts.length;i++){
      var el = muts[i].target;
      if (el.closest && (el.closest('#kap-rep') || el.closest('#kap-teaser'))) return;  /* ignore our own writes */
    }
    later();
  }).observe(document.getElementById('root'), {childList:true, subtree:true});
  setInterval(function(){ if ((location.hash||'').indexOf('/summary')>=0) render(); }, 2000);
  later();
})();
</script>

<script id="kap-cco-cta">
/* Gentle upgrade path from the $27 toolkit's Credit Cards tool to the
   $47 Credit Card Optimization System (separate product). */

    var el = document.getElementById('kap-cco-cta-box');

    if (!main || el || document.getElementById('kap-premium')) return;
    el = document.createElement('div'); el.id='kap-cco-cta-box'; el.className='kap-premium'; el.style.textAlign='center';
    el.innerHTML = '<div class="kick">GO DEEPER · SEPARATE PRODUCT</div>' +
